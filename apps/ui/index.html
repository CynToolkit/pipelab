<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pipelab UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      html,
      body,
      #app {
        border: none;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html {
        font-family: "Geist", system-ui, sans-serif;
        color-scheme: light;
        background: #f8fafc;
        color: #111827;
      }
      html.dark {
        color-scheme: dark;
        background: #111827;
        color: #f3f4f6;
      }
      body {
        background: inherit;
        color: inherit;
      }
      .boot-shell {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        background: #f8fafc;
      }
      .dark .boot-shell {
        background: #111827;
      }
      .boot-wordmark {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        color: #111827;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .dark .boot-wordmark {
        color: #f3f4f6;
      }
      .boot-mark {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 0.22rem;
        background: #6366f1;
      }
    </style>
    <script>
      try {
        const theme = localStorage.getItem("pipelab.theme");
        document.documentElement.classList.toggle("dark", theme === "dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" role="status" aria-label="Loading Pipelab">
        <div class="boot-wordmark" aria-hidden="true">
          <span class="boot-mark"></span>
          <span>Pipelab</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
