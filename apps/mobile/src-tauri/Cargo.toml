[package]
name = "pipelab-mobile"
version = "2.0.0"
description = "Pipelab mobile app"
authors = ["CynToolkit"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix is required on Windows where `name` would otherwise
# conflict with the binary name.
name = "pipelab_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.11.5", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.32", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
anyhow = "1.0"
dirs = "5.0"

tauri-plugin-shell = "2.11.5"
tauri-plugin-fs = "2.11.5"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-devtools = "2.0.0"
tauri-plugin-sql = "2"
