name: Deploy Pull Request Previews

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/documentation/**"
      - "apps/ui/**"
      - "apps/website/**"
      - "apps/desktop/**"
      - "apps/cli/**"
      - "packages/**"
      - "plugins/**"
      - "workers/**"
      - "supabase/**"
      - "ARCHITECTURE.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-documentation.yml"
      - ".github/workflows/deploy-editor.yml"
      - ".github/workflows/deploy-website.yml"
      - ".github/workflows/deploy-previews.yml"

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  documentation:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm docs:build

      - name: Resolve Cloudflare branch name
        id: branch
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          branch="${GH_HEAD_REF//\//-}"
          branch="${branch//[^a-zA-Z0-9_-]/-}"
          if [[ -z "$branch" ]]; then
            echo 'Could not determine the Cloudflare Pages branch name.' >&2
            exit 1
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy documentation to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/documentation/.vitepress/dist --project-name=pipelab-docs --branch=${{ steps.branch.outputs.name }}

  editor:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor UI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm --filter @pipelab/ui build

      - name: Resolve Cloudflare branch name
        id: branch
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          branch="${GH_HEAD_REF//\//-}"
          branch="${branch//[^a-zA-Z0-9_-]/-}"
          if [[ -z "$branch" ]]; then
            echo 'Could not determine the Cloudflare Pages branch name.' >&2
            exit 1
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy editor UI to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/ui/dist --project-name=${{ secrets.CLOUDFLARE_EDITOR_UI_PROJECT_NAME }} --branch=${{ steps.branch.outputs.name }}

  website:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm --filter @pipelab/website build

      - name: Resolve Cloudflare branch name
        id: branch
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          branch="${GH_HEAD_REF//\//-}"
          branch="${branch//[^a-zA-Z0-9_-]/-}"
          if [[ -z "$branch" ]]; then
            echo 'Could not determine the Cloudflare Pages branch name.' >&2
            exit 1
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy website to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/website/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ steps.branch.outputs.name }}

  comment:
    if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository && !cancelled() }}
    needs: [documentation, editor, website]
    runs-on: ubuntu-latest
    steps:
      - name: Post preview URLs in a single pull request comment
        uses: actions/github-script@v7
        env:
          DOCUMENTATION_URL: ${{ needs.documentation.outputs.preview-url }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          EDITOR_URL: ${{ needs.editor.outputs.preview-url }}
          EDITOR_RESULT: ${{ needs.editor.result }}
          WEBSITE_URL: ${{ needs.website.outputs.preview-url }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        with:
          script: |
            const marker = '<!-- pipelab-preview-deployments -->';
            const services = [
              ['Documentation', process.env.DOCUMENTATION_URL, process.env.DOCUMENTATION_RESULT],
              ['Editor', process.env.EDITOR_URL, process.env.EDITOR_RESULT],
              ['Website', process.env.WEBSITE_URL, process.env.WEBSITE_RESULT],
            ];
            const lines = services.map(([name, url, result]) => {
              if (result === 'success' && url) return `- **${name}:** [Open preview](${url})`;
              return `- **${name}:** preview unavailable (${result})`;
            });
            const body = `${marker}\n### Pipelab preview deployments\n${lines.join('\n')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const legacyMarkers = [
              '<!-- pipelab-preview-documentation -->',
              '<!-- pipelab-preview-editor -->',
              '<!-- pipelab-preview-website -->',
            ];
            for (const comment of comments) {
              if (
                comment.user?.login === 'github-actions[bot]' &&
                legacyMarkers.some((legacyMarker) => comment.body?.includes(legacyMarker))
              ) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            }

            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
