name: Deploy Pull Request Previews

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/documentation/**"
      - "apps/ui/**"
      - "apps/website/**"
      - "apps/desktop/**"
      - "apps/cli/**"
      - "packages/**"
      - "plugins/**"
      - "workers/**"
      - "supabase/**"
      - "ARCHITECTURE.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-documentation.yml"
      - ".github/workflows/deploy-editor.yml"
      - ".github/workflows/deploy-website.yml"
      - ".github/workflows/deploy-previews.yml"

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      documentation: ${{ steps.detect.outputs.documentation }}
      editor: ${{ steps.detect.outputs.editor }}
      website: ${{ steps.detect.outputs.website }}
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      - name: Detect affected previews
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const paths = files.map(file => file.filename);
            const hasPrefix = prefix => paths.some(path => path.startsWith(prefix));
            const hasAny = candidates => candidates.some(path => paths.includes(path));
            const shared = hasPrefix('packages/') || hasPrefix('plugins/') || hasAny([
              'package.json',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'turbo.json',
            ]);
            const previewWorkflowChanged = paths.includes('.github/workflows/deploy-previews.yml');

            const documentation = previewWorkflowChanged || shared || hasAny([
              'ARCHITECTURE.md',
              '.github/workflows/deploy-documentation.yml',
            ]) || hasPrefix('apps/documentation/') || hasPrefix('apps/ui/') ||
              hasPrefix('apps/desktop/') || hasPrefix('apps/cli/') ||
              hasPrefix('workers/') || hasPrefix('supabase/');
            const editor = previewWorkflowChanged || shared || hasPrefix('apps/ui/') ||
              paths.includes('.github/workflows/deploy-editor.yml');
            const website = previewWorkflowChanged || shared || hasPrefix('apps/website/') ||
              paths.includes('.github/workflows/deploy-website.yml');

            const branch = context.payload.pull_request.head.ref
              .toLowerCase()
              .replace(/[^a-z0-9]/g, '-');
            if (!branch) throw new Error('Could not determine the Cloudflare Pages branch name.');

            core.setOutput('documentation', String(documentation));
            core.setOutput('editor', String(editor));
            core.setOutput('website', String(website));
            core.setOutput('branch', branch);

  deploy-documentation:
    needs: changes
    if: ${{ needs.changes.outputs.documentation == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Full URLs contain masked project-name secrets, so only pass the public deployment ID between jobs.
    outputs:
      deployment-id: ${{ steps.deployment.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm docs:build

      - name: Deploy documentation preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/documentation/.vitepress/dist --project-name=pipelab-docs --branch=${{ needs.changes.outputs.branch }}

      - name: Capture deployment ID
        id: deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PROJECT_NAME: pipelab-docs
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const url = new URL(process.env.DEPLOYMENT_URL);
          const suffix = `.${process.env.PROJECT_NAME}.pages.dev`;
          if (url.protocol !== 'https:' || !url.hostname.endsWith(suffix)) {
            throw new Error('Cloudflare returned an unexpected documentation deployment URL.');
          }
          const id = url.hostname.slice(0, -suffix.length);
          if (!/^[a-z0-9-]+$/.test(id)) throw new Error('Cloudflare returned an invalid deployment ID.');
          console.log(`id=${id}`);
          NODE

  deploy-editor:
    needs: changes
    if: ${{ needs.changes.outputs.editor == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      deployment-id: ${{ steps.deployment.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor UI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm --filter @pipelab/ui build

      - name: Deploy editor preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/ui/dist --project-name=${{ secrets.CLOUDFLARE_EDITOR_UI_PROJECT_NAME }} --branch=${{ needs.changes.outputs.branch }}

      - name: Capture deployment ID
        id: deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PROJECT_NAME: ${{ secrets.CLOUDFLARE_EDITOR_UI_PROJECT_NAME }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const url = new URL(process.env.DEPLOYMENT_URL);
          const suffix = `.${process.env.PROJECT_NAME}.pages.dev`;
          if (url.protocol !== 'https:' || !url.hostname.endsWith(suffix)) {
            throw new Error('Cloudflare returned an unexpected editor deployment URL.');
          }
          const id = url.hostname.slice(0, -suffix.length);
          if (!/^[a-z0-9-]+$/.test(id)) throw new Error('Cloudflare returned an invalid deployment ID.');
          console.log(`id=${id}`);
          NODE

  deploy-website:
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      deployment-id: ${{ steps.deployment.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm --filter @pipelab/website build

      - name: Deploy website preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/website/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ needs.changes.outputs.branch }}

      - name: Capture deployment ID
        id: deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const url = new URL(process.env.DEPLOYMENT_URL);
          const suffix = `.${process.env.PROJECT_NAME}.pages.dev`;
          if (url.protocol !== 'https:' || !url.hostname.endsWith(suffix)) {
            throw new Error('Cloudflare returned an unexpected website deployment URL.');
          }
          const id = url.hostname.slice(0, -suffix.length);
          if (!/^[a-z0-9-]+$/.test(id)) throw new Error('Cloudflare returned an invalid deployment ID.');
          console.log(`id=${id}`);
          NODE

  comment:
    needs: [changes, deploy-documentation, deploy-editor, deploy-website]
    if: ${{ always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Update the combined preview comment
        uses: actions/github-script@v7
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCUMENTATION_PROJECT_NAME: pipelab-docs
          DOCUMENTATION_CHANGED: ${{ needs.changes.outputs.documentation }}
          DOCUMENTATION_RESULT: ${{ needs.deploy-documentation.result }}
          DOCUMENTATION_DEPLOYMENT_ID: ${{ needs.deploy-documentation.outputs.deployment-id }}
          EDITOR_PROJECT_NAME: ${{ secrets.CLOUDFLARE_EDITOR_UI_PROJECT_NAME }}
          EDITOR_CHANGED: ${{ needs.changes.outputs.editor }}
          EDITOR_RESULT: ${{ needs.deploy-editor.result }}
          EDITOR_DEPLOYMENT_ID: ${{ needs.deploy-editor.outputs.deployment-id }}
          WEBSITE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          WEBSITE_CHANGED: ${{ needs.changes.outputs.website }}
          WEBSITE_RESULT: ${{ needs.deploy-website.result }}
          WEBSITE_DEPLOYMENT_ID: ${{ needs.deploy-website.outputs.deployment-id }}
        with:
          script: |
            const marker = '<!-- pipelab-preview-deployments -->';
            const previews = [
              ['Documentation', process.env.DOCUMENTATION_CHANGED, process.env.DOCUMENTATION_RESULT, process.env.DOCUMENTATION_DEPLOYMENT_ID, process.env.DOCUMENTATION_PROJECT_NAME],
              ['Editor', process.env.EDITOR_CHANGED, process.env.EDITOR_RESULT, process.env.EDITOR_DEPLOYMENT_ID, process.env.EDITOR_PROJECT_NAME],
              ['Website', process.env.WEBSITE_CHANGED, process.env.WEBSITE_RESULT, process.env.WEBSITE_DEPLOYMENT_ID, process.env.WEBSITE_PROJECT_NAME],
            ];
            const lines = previews.map(([name, changed, result, deploymentId, project]) => {
              if (process.env.CHANGES_RESULT !== 'success') {
                return `- **${name}:** change detection failed`;
              }
              if (changed !== 'true') return `- **${name}:** not affected`;
              if (result !== 'success') return `- **${name}:** deployment failed (${result || 'no result'})`;

              if (!/^[a-z0-9-]+$/.test(project) || !/^[a-z0-9-]+$/.test(deploymentId)) {
                return `- **${name}:** deployment succeeded; preview URL could not be formed`;
              }

              const url = new URL(`https://${deploymentId}.${project}.pages.dev`);
              return `- **${name}:** ${url.toString()}`;
            });
            const body = [marker, '### Pull request previews', '', ...lines].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && (comment.body || '').includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
