name: Deploy Pull Request Previews

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/documentation/**"
      - "apps/ui/**"
      - "apps/website/**"
      - "apps/desktop/**"
      - "apps/cli/**"
      - "packages/**"
      - "plugins/**"
      - "workers/**"
      - "supabase/**"
      - "ARCHITECTURE.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-documentation.yml"
      - ".github/workflows/deploy-editor.yml"
      - ".github/workflows/deploy-website.yml"
      - ".github/workflows/deploy-previews.yml"

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm docs:build

      - name: Build editor UI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm --filter @pipelab/ui build

      - name: Build website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm --filter @pipelab/website build

      - name: Resolve Cloudflare branch name
        id: branch
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          branch="${GH_HEAD_REF//\//-}"
          branch="${branch//[^a-zA-Z0-9_-]/-}"
          if [[ -z "$branch" ]]; then
            echo 'Could not determine the Cloudflare Pages branch name.' >&2
            exit 1
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy documentation preview
        id: deploy-documentation
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/documentation/.vitepress/dist --project-name=pipelab-docs --branch=${{ steps.branch.outputs.name }}

      - name: Deploy editor preview
        id: deploy-editor
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/ui/dist --project-name=${{ secrets.CLOUDFLARE_EDITOR_UI_PROJECT_NAME }} --branch=${{ steps.branch.outputs.name }}

      - name: Deploy website preview
        id: deploy-website
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/website/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ steps.branch.outputs.name }}

      - name: Update the combined preview comment
        if: ${{ always() && !cancelled() }}
        uses: actions/github-script@v7
        env:
          DOCUMENTATION_URL: ${{ steps.deploy-documentation.outputs.deployment-url }}
          DOCUMENTATION_RESULT: ${{ steps.deploy-documentation.outcome }}
          EDITOR_URL: ${{ steps.deploy-editor.outputs.deployment-url }}
          EDITOR_RESULT: ${{ steps.deploy-editor.outcome }}
          WEBSITE_URL: ${{ steps.deploy-website.outputs.deployment-url }}
          WEBSITE_RESULT: ${{ steps.deploy-website.outcome }}
        with:
          script: |
            const marker = '<!-- pipelab-preview-deployments -->';
            const previews = [
              ['Documentation', process.env.DOCUMENTATION_URL, process.env.DOCUMENTATION_RESULT],
              ['Editor', process.env.EDITOR_URL, process.env.EDITOR_RESULT],
              ['Website', process.env.WEBSITE_URL, process.env.WEBSITE_RESULT],
            ];
            const lines = previews.map(([name, rawUrl, result]) => {
              let url;
              try {
                const parsed = new URL(rawUrl);
                if (parsed.protocol === 'https:') url = parsed.toString();
              } catch {}

              if (url) return `- **${name}:** ${url}`;
              return `- **${name}:** preview unavailable (${result || 'not run'})`;
            });
            const body = [marker, '### Pull request previews', '', ...lines].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.filter(comment =>
              comment.user.type === 'Bot' &&
              (comment.body.includes(marker) || [
                '<!-- pipelab-preview-documentation -->',
                '<!-- pipelab-preview-editor -->',
                '<!-- pipelab-preview-website -->',
              ].some(oldMarker => comment.body.includes(oldMarker)))
            );
            const combined = previous.find(comment => comment.body.includes(marker));

            if (combined) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: combined.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            for (const comment of previous) {
              if (comment.id !== combined?.id) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            }
