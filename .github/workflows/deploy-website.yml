name: Deploy Website

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/website/**'
      - 'packages/**'
      - 'plugins/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'apps/website/**'
      - 'packages/**'
      - 'plugins/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-website.yml'
      - '.github/actions/upsert-preview-comment/action.yml'
permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm --filter @pipelab/website build

      - name: Resolve Cloudflare branch name
        id: branch
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          branch="${GH_HEAD_REF:-$GH_REF_NAME}"
          branch="${branch//\//-}"
          branch="${branch//[^a-zA-Z0-9_-]/-}"
          if [[ -z "$branch" ]]; then
            echo 'Could not determine the Cloudflare Pages branch name.' >&2
            exit 1
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy website to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/website/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ steps.branch.outputs.name }}

      - name: Post website preview comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/upsert-preview-comment
        with:
          name: Website
          url: ${{ steps.deploy.outputs.deployment-url }}
          marker: "<!-- pipelab-preview-website -->"
