name: Deploy Editor UI

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/ui/**'
      - 'packages/**'
      - 'plugins/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-editor.yml'
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/ui/**'
      - 'packages/**'
      - 'plugins/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-editor.yml'

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor UI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm --filter @pipelab/ui build

      - name: Resolve Cloudflare branch name
        id: branch
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          branch="$GH_REF_NAME"
          if [[ "$GH_EVENT_NAME" == 'pull_request' ]]; then
            branch="$GH_HEAD_REF"
          fi
          branch="${branch//\//-}"
          branch="${branch//[^a-zA-Z0-9_-]/-}"
          if [[ -z "$branch" ]]; then
            echo 'Could not determine the Cloudflare Pages branch name.' >&2
            exit 1
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy editor UI to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/ui/dist --project-name=${{ secrets.CLOUDFLARE_EDITOR_UI_PROJECT_NAME }} --branch=${{ steps.branch.outputs.name }}

      - name: Post editor preview URL to pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- pipelab-preview-editor -->';
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            if (!deploymentUrl) throw new Error('Cloudflare did not return an editor preview URL.');

            const body = `${marker}\n### Pipelab editor preview\n[Open editor preview](${deploymentUrl})`;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
