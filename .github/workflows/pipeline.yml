name: Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      forcePublish:
        description: "Force publish apps"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

# Obsolete push and PR CI runs are safe to cancel. Manual runs get a unique
# group so an operator's run is never cancelled by a later commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
      needs_build: ${{ steps.detect.outputs.needs_build }}
      desktop_changed: ${{ steps.detect.outputs.desktop_changed }}
      needs_windows_smoke: ${{ steps.detect.outputs.needs_windows_smoke }}
      needs_macos_smoke: ${{ steps.detect.outputs.needs_macos_smoke }}
      needs_desktop_build: ${{ steps.detect.outputs.needs_desktop_build }}
      desktop_version_changed: ${{ steps.detect.outputs.desktop_version_changed }}
      desktop_version: ${{ steps.detect.outputs.desktop_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Test change detection
        run: node --test scripts/detect-changes-logic.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect Changes
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            # On feature push, compare against the previous commit (delta).
            BASE_REF="${{ github.event.before }}"
          fi

          if [ -z "$BASE_REF" ] || [ "$BASE_REF" == "0000000000000000000000000000000000000000" ]; then
            BASE_REF=$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")
          fi

          echo "Comparing against: $BASE_REF"
          git diff --name-only "$BASE_REF" HEAD > changed-files.txt
          pnpm exec turbo ls -F "...[$BASE_REF]" --output=json > affected.json
          npx tsx scripts/detect-changes.ts affected.json changed-files.txt "$BASE_REF"

      - name: Write change metadata
        env:
          AFFECTED: ${{ steps.detect.outputs.affected }}
          NEEDS_BUILD: ${{ steps.detect.outputs.needs_build }}
          DESKTOP_CHANGED: ${{ steps.detect.outputs.desktop_changed }}
          NEEDS_WINDOWS_SMOKE: ${{ steps.detect.outputs.needs_windows_smoke }}
          NEEDS_MACOS_SMOKE: ${{ steps.detect.outputs.needs_macos_smoke }}
          NEEDS_DESKTOP_BUILD: ${{ steps.detect.outputs.needs_desktop_build }}
          DESKTOP_VERSION_CHANGED: ${{ steps.detect.outputs.desktop_version_changed }}
          DESKTOP_VERSION: ${{ steps.detect.outputs.desktop_version }}
          FORCE_PUBLISH: ${{ inputs.forcePublish }}
          PRERELEASE: ${{ inputs.prerelease }}
          GIT_REF: ${{ github.ref }}
          GIT_EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const boolean = (value) => value === 'true';
          writeFileSync('metadata.json', `${JSON.stringify({
            sha: process.env.GITHUB_SHA,
            ref: process.env.GIT_REF,
            event_name: process.env.GIT_EVENT_NAME,
            affected: JSON.parse(process.env.AFFECTED),
            needs_build: boolean(process.env.NEEDS_BUILD),
            desktop_changed: boolean(process.env.DESKTOP_CHANGED),
            needs_windows_smoke: boolean(process.env.NEEDS_WINDOWS_SMOKE),
            needs_macos_smoke: boolean(process.env.NEEDS_MACOS_SMOKE),
            needs_desktop_build: boolean(process.env.NEEDS_DESKTOP_BUILD),
            desktop_version_changed: boolean(process.env.DESKTOP_VERSION_CHANGED),
            desktop_version: process.env.DESKTOP_VERSION,
            force_publish: boolean(process.env.FORCE_PUBLISH),
            prerelease: boolean(process.env.PRERELEASE),
          }, null, 2)}\n`);
          NODE

      - name: Upload change metadata
        uses: actions/upload-artifact@v4
        with:
          name: change-metadata
          path: metadata.json
          if-no-files-found: error

  verify-lint:
    name: Verify Lint
    needs: changes
    if: needs.changes.outputs.affected != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-
      - name: Lint affected packages
        env:
          AFFECTED_PACKAGES: ${{ needs.changes.outputs.affected }}
        shell: bash
        run: |
          filter_args=()
          while IFS= read -r package; do
            filter_args+=(--filter "$package")
          done < <(node -e 'JSON.parse(process.env.AFFECTED_PACKAGES).forEach((name) => console.log(name))')
          pnpm turbo lint "${filter_args[@]}" --cache-dir=.turbo

  verify-typecheck:
    name: Verify Typecheck
    needs: changes
    if: needs.changes.outputs.affected != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-
      - name: Emit declarations for affected package dependencies
        env:
          AFFECTED_PACKAGES: ${{ needs.changes.outputs.affected }}
        shell: bash
        run: |
          filter_args=()
          while IFS= read -r package; do
            filter_args+=(--filter "${package}^...")
          done < <(node -e 'JSON.parse(process.env.AFFECTED_PACKAGES).forEach((name) => console.log(name))')
          pnpm turbo typecheck "${filter_args[@]}" --concurrency=1 --cache-dir=.turbo
      - name: Typecheck affected packages
        env:
          AFFECTED_PACKAGES: ${{ needs.changes.outputs.affected }}
        shell: bash
        run: |
          filter_args=()
          while IFS= read -r package; do
            filter_args+=(--filter "$package")
          done < <(node -e 'JSON.parse(process.env.AFFECTED_PACKAGES).forEach((name) => console.log(name))')
          pnpm turbo typecheck "${filter_args[@]}" --concurrency=2 --cache-dir=.turbo

  test-linux:
    name: Test Linux
    needs: changes
    if: needs.changes.outputs.affected != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-
      - name: Test affected packages
        env:
          AFFECTED_PACKAGES: ${{ needs.changes.outputs.affected }}
        shell: bash
        run: |
          filter_args=()
          while IFS= read -r package; do
            filter_args+=(--filter "$package")
          done < <(node -e 'JSON.parse(process.env.AFFECTED_PACKAGES).forEach((name) => console.log(name))')
          pnpm turbo test "${filter_args[@]}" --cache-dir=.turbo --log-order=grouped --concurrency=2

  build-all:
    name: Build All
    needs: changes
    if: >-
      needs.changes.outputs.needs_build == 'true' ||
      needs.changes.outputs.needs_desktop_build == 'true' ||
      inputs.forcePublish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-
      - name: Build packages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm build --concurrency=2 --cache-dir=.turbo
      - name: Upload monorepo-dist
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-dist
          path: |
            packages/*/dist/**
            plugins/*/dist/**
            apps/*/dist/**
            apps/desktop/.vite/**
            apps/ui/dist/**
          if-no-files-found: error

  windows-smoke:
    name: Windows Smoke
    needs: [changes]
    if: needs.changes.outputs.needs_windows_smoke == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Windows filesystem behavior
        if: contains(fromJSON(needs.changes.outputs.affected), '@pipelab/core-node')
        run: pnpm --filter @pipelab/core-node exec vitest run src/fs-utils.test.ts
      - name: Test Windows desktop host behavior
        if: contains(fromJSON(needs.changes.outputs.affected), '@pipelab/app')
        run: pnpm --filter @pipelab/app test
      - name: Test Windows Electron integration behavior
        if: contains(fromJSON(needs.changes.outputs.affected), '@pipelab/plugin-electron')
        run: pnpm --filter @pipelab/plugin-electron test
      - name: Test Windows Steam integration behavior
        if: contains(fromJSON(needs.changes.outputs.affected), '@pipelab/plugin-steam')
        run: pnpm --filter @pipelab/plugin-steam test

  macos-smoke:
    name: macOS ARM Smoke
    needs: [changes]
    if: needs.changes.outputs.needs_macos_smoke == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Electron and CLI dependency closures
        run: >-
          pnpm exec turbo build
          --filter=@pipelab/app...
          --filter=@pipelab/cli...
          --concurrency=2
          --force
      - name: Package Electron app on macOS ARM
        run: pnpm --filter @pipelab/app package

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, verify-lint, verify-typecheck, test-linux, windows-smoke, macos-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable verification jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.verify-lint.result }}
          TYPECHECK: ${{ needs.verify-typecheck.result }}
          TEST_LINUX: ${{ needs.test-linux.result }}
          WINDOWS_SMOKE: ${{ needs.windows-smoke.result }}
          MACOS_SMOKE: ${{ needs.macos-smoke.result }}
          NEEDS_WINDOWS_SMOKE: ${{ needs.changes.outputs.needs_windows_smoke }}
          NEEDS_MACOS_SMOKE: ${{ needs.changes.outputs.needs_macos_smoke }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]]
          for result in "$LINT" "$TYPECHECK" "$TEST_LINUX"; do
            [[ "$result" == success || "$result" == skipped ]]
          done
          if [[ "$NEEDS_WINDOWS_SMOKE" == true ]]; then
            [[ "$WINDOWS_SMOKE" == success ]]
          else
            [[ "$WINDOWS_SMOKE" == success || "$WINDOWS_SMOKE" == skipped ]]
          fi
          if [[ "$NEEDS_MACOS_SMOKE" == true ]]; then
            [[ "$MACOS_SMOKE" == success ]]
          else
            [[ "$MACOS_SMOKE" == success || "$MACOS_SMOKE" == skipped ]]
          fi

  build-desktop:
    name: Build Desktop (${{ matrix.os }} - ${{ matrix.arch }})
    needs: [build-all, changes]
    if: >-
      always() && needs.build-all.result == 'success' &&
      (needs.changes.outputs.needs_desktop_build == 'true' || inputs.forcePublish)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-26-intel
            arch: x64
          - os: macos-26
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download monorepo-dist
        uses: actions/download-artifact@v4
        with:
          name: monorepo-dist
          path: .
      - name: Import Apple Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v3
        if: startsWith(matrix.os, 'macos-') && github.event_name != 'pull_request'
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          p12-password: ${{ secrets.CERTIFICATE_OSX_APPLICATION_PASSWORD }}
      - name: Package & Make Desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: pnpm --filter @pipelab/app make -- --arch=${{ matrix.arch }}
      - name: Verify macOS executable architecture
        if: startsWith(matrix.os, 'macos-')
        env:
          EXPECTED_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
        shell: bash
        run: |
          app=$(find apps/desktop/out -type d -name '*.app' -print -quit)
          test -n "$app"
          executable=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -print -quit)
          test -n "$executable"
          architectures=$(lipo -archs "$executable")
          echo "Built architectures: $architectures"
          [[ " $architectures " == *" $EXPECTED_ARCH "* ]]
      - name: Verify macOS code signature
        if: startsWith(matrix.os, 'macos-') && github.event_name != 'pull_request'
        shell: bash
        run: |
          app=$(find apps/desktop/out -type d -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
