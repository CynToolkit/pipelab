name: CI

on:
  push:
    branches: [develop, main, acceptance/local-construct-electron]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-release-platforms:
    name: Local release checks / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local release workflow and artifact tests
        run: pnpm --filter @pipelab/cli test:release-platforms

      - name: Run run-history recovery tests
        run: pnpm --filter @pipelab/core-node test

      - name: Run Desktop IPC and artifact tests
        run: pnpm --filter @pipelab/app test

      - name: Run Construct profile validation tests
        run: pnpm --filter @pipelab/providers test:construct

  authenticated-local-release:
    name: Authenticated local Ship / ${{ matrix.os }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/acceptance/local-construct-electron')
    needs: local-release-platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the disposable Construct CI test account
        shell: bash
        env:
          CONSTRUCT_CI_USERNAME: ${{ secrets.CONSTRUCT_CI_USERNAME }}
          CONSTRUCT_CI_PASSWORD: ${{ secrets.CONSTRUCT_CI_PASSWORD }}
        run: |
          if [[ -z "$CONSTRUCT_CI_USERNAME" || -z "$CONSTRUCT_CI_PASSWORD" ]]; then
            echo "::error::Configure CONSTRUCT_CI_USERNAME and CONSTRUCT_CI_PASSWORD for authenticated local release acceptance."
            exit 1
          fi

      - name: Create isolated CI application and browser-profile directories
        run: node apps/cli/scripts/prepare-local-ci-data.mjs

      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @pipelab/providers exec playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: pnpm --filter @pipelab/providers exec playwright install chromium

      - name: Populate disposable Construct profile through the Construct editor
        env:
          CONSTRUCT_CI_USERNAME: ${{ secrets.CONSTRUCT_CI_USERNAME }}
          CONSTRUCT_CI_PASSWORD: ${{ secrets.CONSTRUCT_CI_PASSWORD }}
        run: node packages/providers/scripts/prepare-construct-ci-profile.mjs

      - name: Run first authenticated Construct to Electron Ship
        env:
          CONSTRUCT_CI_RUN_NUMBER: "1"
          CONSTRUCT_CI_REQUIRED: "true"
          NODE_ENV: development
        run: pnpm --filter @pipelab/cli test:construct-live

      - name: Cold-start Desktop and verify the first run (Linux)
        if: runner.os == 'Linux'
        env:
          NODE_ENV: development
          PIPELAB_E2E_HISTORY_PATH: /workflows/ci-construct-electron-acceptance/ci-project/runs
          PIPELAB_E2E_EXPECTED_RUNS: "1"
        run: xvfb-run -a pnpm --filter @pipelab/app test:local-release-e2e

      - name: Cold-start Desktop and verify the first run (Windows and macOS)
        if: runner.os != 'Linux'
        env:
          NODE_ENV: development
          PIPELAB_E2E_HISTORY_PATH: /workflows/ci-construct-electron-acceptance/ci-project/runs
          PIPELAB_E2E_EXPECTED_RUNS: "1"
        run: pnpm --filter @pipelab/app test:local-release-e2e

      - name: Run a new Ship after Desktop restart and verify saved history
        env:
          CONSTRUCT_CI_RUN_NUMBER: "2"
          CONSTRUCT_CI_REQUIRED: "true"
          NODE_ENV: development
        run: pnpm --filter @pipelab/cli test:construct-live

      - name: Cold-start Desktop and verify both runs and artifacts (Linux)
        if: runner.os == 'Linux'
        env:
          NODE_ENV: development
          PIPELAB_E2E_HISTORY_PATH: /workflows/ci-construct-electron-acceptance/ci-project/runs
          PIPELAB_E2E_EXPECTED_RUNS: "2"
        run: xvfb-run -a pnpm --filter @pipelab/app test:local-release-e2e

      - name: Cold-start Desktop and verify both runs and artifacts (Windows and macOS)
        if: runner.os != 'Linux'
        env:
          NODE_ENV: development
          PIPELAB_E2E_HISTORY_PATH: /workflows/ci-construct-electron-acceptance/ci-project/runs
          PIPELAB_E2E_EXPECTED_RUNS: "2"
        run: pnpm --filter @pipelab/app test:local-release-e2e

  verify:
    name: CI / ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ matrix.task }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ matrix.task }}-
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Deno
        if: matrix.task == 'test'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.9

      - name: Run verification
        if: matrix.task != 'build'
        run: pnpm ${{ matrix.task }} --concurrency=2

      - name: Verify Supabase billing functions
        if: matrix.task == 'test'
        run: |
          deno lint \
            supabase/functions/_shared/billing.ts \
            supabase/functions/_shared/billing.test.ts \
            supabase/functions/polar-user-plan/index.ts \
            supabase/functions/polar-available-plans/index.ts \
            supabase/functions/customer-portal/index.ts \
            supabase/functions/checkout/index.ts
          deno check \
            supabase/functions/polar-user-plan/index.ts \
            supabase/functions/polar-available-plans/index.ts \
            supabase/functions/customer-portal/index.ts \
            supabase/functions/checkout/index.ts
          deno test supabase/functions/_shared/billing.test.ts

      - name: Build
        if: matrix.task == 'build'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm build --concurrency=2

      - name: Package Linux desktop smoke
        if: matrix.task == 'build'
        run: pnpm --filter @pipelab/app package
