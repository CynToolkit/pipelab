[tools]
node = "24"
pnpm = "10.33.0"
supabase = "2.117.0"

[tasks.install]
run = "pnpm install"
dir = "apps/desktop"

[tasks.dev]
run = "doppler run -- pnpm dev"
dir = "apps/desktop"
depends = ["install"]

[tasks.stop]
description = "Stop the local Pipelab backend"
run = "pnpm --filter @pipelab/cli start -- stop"
env = { NODE_ENV = "development" }

[tasks.local]
description = "Start local Supabase and workers with the desktop app or standalone UI"
run = '''
#!/usr/bin/env bash
set -euo pipefail

target="${1:-desktop}"
case "$target" in
  ui)
    mise run local:setup
    mise run local:r2 ::: local:api ::: local:ui
    ;;
  desktop)
    mise run local:setup
    mise run local:r2 ::: local:api ::: local:app
    ;;
  *)
    echo "Usage: mise run local [desktop|ui] (both modes start Supabase and local workers)" >&2
    exit 2
    ;;
esac
'''

[tasks.package]
run = "doppler run -- pnpm package"
dir = "apps/desktop"
depends = ["install"]

[tasks.test-e2e-local]
run = "doppler run -- pnpm test:e2e"
dir = "apps/desktop"
depends = ["package"]

[tasks.docs-install]
run = "pnpm install"
dir = "apps/documentation"

[tasks.docs-dev]
run = "pnpm dev"
dir = "apps/documentation"
depends = ["docs-install", "docs-generate-mermaid"]

[tasks.docs-generate-mermaid]
run = [
  "pnpm exec mmdc -i assets/architecture/architecture.mermaid -o assets/architecture/architecture.svg",
  "pnpm exec mmdc -i assets/roadmap.mermaid -o assets/roadmap.svg",
  "pnpm exec mmdc -i assets/engine-choose.mermaid -o assets/engine-choose.svg",
  "pnpm exec mmdc -i assets/graph-processing-flow.mermaid -o assets/graph-processing-flow.svg",
]
dir = "apps/documentation"
depends = ["docs-install"]

[tasks."local:setup"]
description = "Initialize Supabase locally and apply migrations"
run = '''
set -eu
pnpm install
if [ ! -f supabase/config.toml ]; then
  supabase init
fi
supabase start
supabase migration up --local
'''

[tasks."local:r2"]
description = "Run the local S3-compatible R2 Worker"
run = "pnpm --filter @pipelab/cloud-workers dev:r2"

[tasks."local:api"]
description = "Run the Pipelab Cloud Worker against local Supabase and R2"
run = '''
set -eu
eval "$(supabase status --output env)"
export SUPABASE_URL="${API_URL:-${SUPABASE_URL:-}}"
export SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}}"
export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}}"
: "${SUPABASE_URL:?Could not read local Supabase URL; run mise run local:setup first}"
: "${SUPABASE_ANON_KEY:?Could not read local Supabase publishable key}"
: "${SUPABASE_SERVICE_ROLE_KEY:?Could not read local Supabase service key}"
export R2_ENDPOINT_URL="http://127.0.0.1:8787"
export R2_ACCOUNT_ID="local"
export R2_ACCESS_KEY_ID="local"
export R2_SECRET_ACCESS_KEY="local"
export R2_BUCKET_NAME="pipelab-cloud-local"
export CLOUDFLARE_INCLUDE_PROCESS_ENV="true"
pnpm --filter @pipelab/cloud-workers dev
'''

[tasks."local:cleanup"]
description = "Run the local Worker's scheduled cleanup handler once"
run = "curl --fail-with-body 'http://127.0.0.1:8788/cdn-cgi/local/scheduled?format=json'"

[tasks."deploy:artifacts"]
description = "Deploy the Pipelab Cloud Worker and inject Doppler secrets"
run = [
  "doppler run -- pnpm --filter @pipelab/cloud-workers deploy",
  "pnpm --filter @pipelab/cloud-workers deploy:secrets",
]
depends = ["install"]

[tasks."local:app"]
description = "Run the desktop app against local Supabase and Pipelab Cloud"
run = '''
set -eu
eval "$(supabase status --output env)"
local_supabase_url="${API_URL:-${SUPABASE_URL:-}}"
local_anon_key="${ANON_KEY:-${PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}}"
local_service_role_key="${SERVICE_ROLE_KEY:-${SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}}"
: "${local_supabase_url:?Could not read local Supabase URL; run mise run local:setup first}"
: "${local_anon_key:?Could not read local Supabase publishable key}"
: "${local_service_role_key:?Could not read local Supabase service key}"
doppler run -- env SUPABASE_URL="$local_supabase_url" SUPABASE_ANON_KEY="$local_anon_key" SUPABASE_SERVICE_ROLE_KEY="$local_service_role_key" PIPELAB_CLOUD_WORKER_URL="http://127.0.0.1:8788" pnpm dev
'''
dir = "apps/desktop"

[tasks."local:ui"]
description = "Run the standalone UI and CLI backend through Turbo"
run = '''
set -eu
eval "$(supabase status --output env)"
export SUPABASE_URL="${API_URL:-${SUPABASE_URL:-}}"
export SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}}"
export PIPELAB_CLOUD_WORKER_URL="http://127.0.0.1:8788"
: "${SUPABASE_URL:?Could not read local Supabase URL; run mise run local:setup first}"
: "${SUPABASE_ANON_KEY:?Could not read local Supabase publishable key}"
pnpm exec turbo run dev:remote --filter=@pipelab/cli --filter=@pipelab/ui
'''
