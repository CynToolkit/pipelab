<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="A short launch film for Pipelab — prepare, build, and ship game releases from one workflow.">
  <meta property="og:title" content="Pipelab — Ship games, not release scripts">
  <meta property="og:description" content="Your game is done. Shipping should be too.">
  <meta property="og:image" content="poster.png">
  <title>Pipelab — Ship games, not release scripts</title>
  <style>
    :root{color-scheme:dark;--bg:#111318;--line:#30343d;--text:#f4f4f5;--muted:#a0a5af;--blue:#83b0ff}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -18%,#202838 0,transparent 46%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:48px 24px}
    main{width:min(1100px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px}.brand{font-size:17px;font-weight:700;letter-spacing:-.03em}.eyebrow,.download{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(34px,5.8vw,68px);line-height:1.02;letter-spacing:-.065em;margin:0 0 18px;font-weight:680}h1 span{color:var(--blue)}.lede{font-size:17px;color:var(--muted);margin:0 0 34px}
    .player{overflow:hidden;border:1px solid #414652;border-radius:18px;background:#08090c;box-shadow:0 32px 90px #0008;aspect-ratio:16/9}.player video{display:block;width:100%;height:100%;object-fit:contain}.below{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:18px}.download{color:#d7d9df;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:11px 14px;letter-spacing:.06em;transition:border-color .2s,color .2s}.download:hover{border-color:var(--blue);color:var(--blue)}.duration{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:48px;padding-top:18px;color:#777e8a;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
    @media(max-width:600px){body{padding:28px 16px}header{margin-bottom:42px}.eyebrow{font-size:10px}.lede{font-size:15px}.player{border-radius:12px}.below{align-items:flex-start;flex-direction:column}.duration{order:-1}footer{margin-top:36px;gap:18px;flex-wrap:wrap}}
  </style>
</head>
<body>
  <main>
    <header><div class="brand">Pipelab</div><div class="eyebrow">A release, reimagined</div></header>
    <section aria-labelledby="headline">
      <h1 id="headline">Your game is done.<br><span>Shipping should be too.</span></h1>
      <p class="lede">From project to players, in one release workflow.</p>
      <div class="player"><video controls playsinline preload="metadata" poster="poster.png" aria-label="Pipelab product launch film"><source src="pipelab-commercial.mp4" type="video/mp4">Your browser does not support HTML video.</video></div>
      <div class="below"><a class="download" href="pipelab-commercial.mp4" download>Download the film ↗</a><span class="duration">35 seconds · 1920 × 1080 · 60 fps</span></div>
    </section>
    <footer><span>Build. Package. Ship.</span><span>Construct · Steam · itch.io · Poki</span></footer>
  </main>
</body>
</html>
