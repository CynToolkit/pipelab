  return card;
}
function routePath(from,to){
  const a=rect(from),b=rect(to),ac={x:a.x+a.w/2,y:a.y+a.h/2},bc={x:b.x+b.w/2,y:b.y+b.h/2};
  const dx=bc.x-ac.x,dy=bc.y-ac.y;
  if(Math.abs(dx)>=Math.abs(dy)){
    const sx=dx>=0?a.x+a.w:a.x,ex=dx>=0?b.x:b.x+b.w,sy=ac.y,ey=bc.y,bend=Math.max(34,Math.abs(ex-sx)*.42)*(dx>=0?1:-1);
    return `M ${sx} ${sy} C ${sx+bend} ${sy} ${ex-bend} ${ey} ${ex} ${ey}`;
  }
  const sy=dy>=0?a.y+a.h:a.y,ey=dy>=0?b.y:b.y+b.h,sx=ac.x,ex=bc.x,bend=Math.max(34,Math.abs(ey-sy)*.42)*(dy>=0?1:-1);
  return `M ${sx} ${sy} C ${sx} ${sy+bend} ${ex} ${ey-bend} ${ex} ${ey}`;

move('itch',layout.workspace.itch,6.9,.96,'power2.inOut',{opacity:1});

const picks=[['.poki-card',9.0],['.steam-card',9.58],['.itch-card',10.16]];
picks.forEach(([sel,at])=>{
  tl.to(sel,{borderColor:'#68a0ff',duration:.18},at);

  tl.to(sel,{scale:1,duration:.14,ease:'power2.inOut'},at+.12);

// Resolve one Build Profile into both outputs; every connector is anchored to card bounds.
hideCaption('.context-destinations',11.05);caption('.context-routes',11.24);
draw('.route-source-profile',11.36,.48);
tl.to('.build-card',{borderColor:'#68a0ff',boxShadow:'0 0 30px rgba(59,130,246,.28),0 24px 70px #0007',duration:.2},11.52);
tl.to('.build-heading-generic',{opacity:0,duration:.16},11.7);
tl.to('.build-resolving',{opacity:1,duration:.18},11.86);
tl.to('.resolve-bar',{opacity:1,scaleX:1,duration:.1},11.86);
tl.to('.resolve-bar i',{scaleX:1,duration:1.35,ease:'power2.inOut'},11.92);
tl.to('.build-resolving',{opacity:0,duration:.16},13.34);
tl.to('.resolve-bar',{opacity:0,duration:.12},13.38);
// The profile card branches into two aligned outputs, one above and one below.
tl.to('.route-source-profile',{opacity:0,duration:.12},13.34);
tl.to('.build-card',{x:layout.workspace.build.x-base.build.x,y:layout.workspace.build.y-base.build.y,scale:layout.workspace.build.w/document.querySelector('.build-card').offsetWidth,duration:.64,ease:'power2.inOut'},13.44);
tl.to('.build-electron',{opacity:1,duration:.22},13.44);
tl.to('.build-kicker .profile-kicker',{opacity:0,duration:.14},13.42);
tl.to('.build-kicker .output-kicker',{opacity:1,duration:.18},13.56);
tl.to('.profile-node',{opacity:1,y:0,duration:.24,ease:'power2.out'},14.66);
tl.set('.web-card',{x:layout.workspace.profile.x-base.web.x,y:layout.workspace.profile.y-base.web.y,scale:layout.workspace.profile.w/document.querySelector('.web-card').offsetWidth,opacity:1},14.1);
tl.to('.web-card',{x:layout.workspace.web.x-base.web.x,y:layout.workspace.web.y-base.web.y,scale:layout.workspace.web.w/document.querySelector('.web-card').offsetWidth,duration:.55,ease:'power2.inOut'},14.12);
tl.to('.web-title,.web-detail',{opacity:0,duration:.14},14.25);
tl.to('.web-route-title,.web-route-detail',{opacity:1,duration:.2},14.38);
// Branch connectors draw only after both output cards settle.
draw('.route-source-profile',14.72,.38);draw('.route-profile-web',14.72,.5);draw('.route-profile-build',14.72,.5);
tl.to('.route-pulse',{opacity:1,attr:{cx:rect('profile').x+rect('profile').w/2,cy:rect('profile').y+rect('profile').h/2},duration:.01},14.72);
tl.to('.route-pulse',{attr:{cx:rect('web').x+rect('web').w/2,cy:rect('web').y+rect('web').h/2},duration:.5,ease:'none'},14.73);
tl.to('.route-pulse',{attr:{cx:rect('build').x+rect('build').w/2,cy:rect('build').y+rect('build').h/2},duration:.5,ease:'none'},15.26);
tl.to('.route-pulse',{opacity:0,duration:.12},15.78);
draw('.route-web-poki',15.84,.48);draw('.route-build-steam',16.42,.48);draw('.route-build-itch',16.98,.48);

hideCaption('.context-routes',20.6);
caption('.context-ready',20.82);
tl.fromTo('.ready-title',{opacity:0,y:7},{opacity:1,y:0,duration:.3,ease:'power2.out'},20.82);
tl.to('.focus-ring',{opacity:1,scale:1,duration:.22,ease:'power2.out'},22.7);
tl.to('.focus-ring',{scale:.72,duration:.1,ease:'power2.in'},23.16);
tl.to('.ship-button',{scale:.94,backgroundColor:'#235ec1',duration:.1,ease:'power2.in'},23.16);
tl.to('.focus-ring',{opacity:0,duration:.14},23.28);
tl.to('.ship-button',{scale:1,backgroundColor:'#3b82f6',duration:.16,ease:'power2.out'},23.3);
tl.to('.ready-title,.context-ready',{opacity:0,y:-5,duration:.18},23.38);
tl.to('.ship-label',{opacity:0,duration:.12},23.38);
tl.to('.run-label',{opacity:1,duration:.12},23.42);
caption('.context-execute',23.52);

// Execute in the release map itself, one operation at a time.
const steps=[
  {kind:'project',sel:'.project-card',start:23.82,duration:.82},
  {kind:'web',sel:'.web-card',start:25.18,duration:1.04},
  {kind:'build',sel:'.build-card',start:26.76,duration:1.18},
  {kind:'poki',sel:'.poki-card',start:28.48,duration:.96},
  {kind:'steam',sel:'.steam-card',start:29.98,duration:.98},
  {kind:'itch',sel:'.itch-card',start:31.5,duration:1.04}
];
steps.forEach((step,index)=>{
  const sel=step.sel,baseScale=(step.kind==='project'||step.kind==='web'||step.kind==='build')?360/490:1;
  tl.to(sel,{borderColor:'#68a0ff',boxShadow:'0 0 28px rgba(59,130,246,.25),0 24px 70px #0007',scale:baseScale*1.025,duration:.18},step.start);
  tl.to(`${sel} .project-main,${sel} .web-route-title,${sel} .web-route-detail,${sel} .build-heading-generic,${sel} .build-electron,${sel} .build-kicker,${sel} .web-kicker,${sel} .web-mark,${sel} .destination-main,${sel} .destination-logo,${sel} .selection-mark`,{opacity:0,duration:.12},step.start);
  tl.to(`${sel} .exec-operation,${sel} .exec-title`,{opacity:1,duration:.16},step.start+.05);
  tl.to(`${sel} .state-waiting`,{opacity:1,duration:.14},step.start+.05);
  tl.to(`${sel} .state-waiting`,{opacity:0,duration:.12},step.start+.18);
  tl.to(`${sel} .state-active`,{opacity:1,duration:.12},step.start+.34);
  tl.to(`${sel} .row-progress`,{opacity:1,scaleX:1,duration:.1},step.start+.34);
  tl.to(`${sel} .row-progress i`,{scaleX:1,duration:step.duration,ease:'power2.inOut'},step.start+.34);
  tl.to(`${sel} .state-active`,{opacity:0,duration:.12},step.start+step.duration+.22);
  tl.to(`${sel} .state-success`,{opacity:1,duration:.16},step.start+step.duration+.42);
  tl.to(sel,{borderColor:'#58d9a0',boxShadow:'0 0 19px rgba(34,197,94,.15),0 24px 70px #0007',scale:baseScale,duration:.2},step.start+step.duration+.32);
});
tl.to('.route-line',{stroke:'#58d9a0',filter:'drop-shadow(0 0 7px rgba(34,197,94,.35))',duration:.28},32.98);
tl.to('.run-label,.ship-button',{opacity:0,duration:.18},33.02);
hideCaption('.context-execute',33.0);
// Result copy lands while the exact same route and cards remain in place.
tl.fromTo('.result-copy',{opacity:0,y:8},{opacity:1,y:0,duration:.38,ease:'power2.out'},33.24);

tl.to('.web-card .exec-title,.build-card .exec-title,.web-card .state-success,.build-card .state-success,.poki-card .exec-title,.steam-card .exec-title,.itch-card .exec-title,.poki-card .state-success,.steam-card .state-success,.itch-card .state-success',{opacity:0,duration:.16},33.28);
tl.to('.artifact-caption,.delivery-result,.web-result-copy,.build-result-copy',{opacity:1,duration:.28,stagger:.08},33.5);

// Continuous handoff: keep the same logo, gently simplify the map, then hold.
tl.to('.result-copy',{opacity:0,y:-5,duration:.28,ease:'power2.inOut'},37.12);
tl.to('.project-card,.web-card,.build-card,.poki-card,.steam-card,.itch-card,.route-line,.route-pulse',{opacity:0,duration:.34,ease:'power2.inOut',stagger:.025},37.2);
tl.set('.route-line',{attr:{d:''}},37.56);
tl.to('.ship-button,.top-rule,.tabs,.frame-outline,.app-shell,.profile-node',{opacity:0,duration:.34,ease:'power2.inOut'},37.2);
tl.to('.brand-lockup',{x:760,y:210,scale:1.08,duration:.56,ease:'power2.inOut'},37.24);
tl.fromTo('.end-card',{opacity:0},{opacity:1,duration:.01},37.55);
tl.fromTo('.end-headline',{opacity:0,y:12},{opacity:1,y:0,duration:.42,ease:'power2.out'},37.62);
window.__timelines['pipelab-continuous']=tl;
</script>
